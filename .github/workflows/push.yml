name: Version, Changelog, and Publish

on:
  push:
    branches: [main]
  # Retries a release that failed after its PR merged, without a new commit.
  workflow_dispatch:

# One release at a time, so two runs never bump from the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, build changelog, publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: npm accepts this workflow's OIDC token
      # instead of a stored, expiring npm token.
      id-token: write
    # Only main releases: npm trusts this workflow from any branch, and a
    # manual run can pick one. A manual run has no head commit, so the
    # release-commit check passes.
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Release @policyengine/ui-kit')"

    steps:
      # The tip of main, not the pushed commit: a run that waited for another
      # release starts from that release's commit, not the version before it.
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Check for changelog fragments
        id: check
        run: .github/check_fragments.sh

      - name: Set up Python
        if: steps.check.outputs.count != '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install towncrier
        if: steps.check.outputs.count != '0'
        run: pip install towncrier

      - name: Bump version
        if: steps.check.outputs.count != '0'
        run: python .github/bump_version.py

      - name: Build changelog
        if: steps.check.outputs.count != '0'
        run: towncrier build --yes --version "$(python -c "import json; print(json.load(open('package.json'))['version'])")"

      - name: Set up Bun
        if: steps.check.outputs.count != '0'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.check.outputs.count != '0'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.check.outputs.count != '0'
        run: bun run build

      - name: Set up Node for npm publish
        if: steps.check.outputs.count != '0'
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Verify npm publishing toolchain
        if: steps.check.outputs.count != '0'
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - name: Publish to npm
        if: steps.check.outputs.count != '0'
        run: npm publish --access public

      - name: Commit and push
        if: steps.check.outputs.count != '0'
        run: .github/commit_and_push.sh
