name: PR checks

on:
  pull_request:

jobs:
  changelog:
    name: Changelog fragment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changelog fragment
        run: |
          count=$(find changelog.d -name '*.md' ! -name '.gitkeep' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No changelog fragment found in changelog.d/. Add a fragment file (e.g. changelog.d/my-change.added.md) describing your change."
            exit 1
          fi
          echo "Found $count changelog fragment(s)."

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
